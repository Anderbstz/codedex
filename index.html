  // A marked block. The course name is typed inline on the block itself; the
  // small edit button is the only path to the editor (ambiente and removal).
  // Clicking the input never opens the editor or toggles the slot.
  function scheduleBlockRow(day, from, to, meta, slots) {
    var startText = slots[from].start;
    var endText = slots[to - 1].end;
    var unitName = meta.unit || "";
    var linkedUnit = unitName ? findUnitByName(unitName) : null;
    var isNow = scheduleBlockIsNow(day, slots[from].startMinutes, slots[to - 1].endMinutes);
    var rangeText = startText + " - " + endText;
    var inputId = "slot-course-" + day + "-" + from + "-" + to;
    var courseLabel = "Curso del bloque del " + scheduleDayName(day) + " " + startText + " a " + endText;
    var editLabel = "Editar bloque del " + scheduleDayName(day) + " " + startText + " a " + endText;

    return el("div", {
      class: "slot-row slot-block" + (isNow ? " is-now" : "") + (linkedUnit ? " is-linked" : ""),
      tabindex: "-1",
      dataset: { day: String(day), from: String(from), to: String(to) },
      on: { click: function () { openScheduleBlockEditor(day, from, to); } }
    }, [
      el("span", { class: "slot-time", text: startText }),
      el("span", { class: "slot-body" }, [
        el("span", { class: "slot-block-info" }, [
          el("span", { class: "slot-block-unit", text: rangeText }),
          el("input", {
            class: "input slot-block-course",
            type: "text", id: inputId, maxlength: "80", autocomplete: "off",
            placeholder: "Escribe el curso",
            value: unitName,
            "aria-label": courseLabel,
            on: {
              click: stopRowActivation,
              mousedown: stopRowActivation,
              pointerdown: stopRowActivation,
              change: function (event) { commitScheduleBlockCourse(day, from, to, event.target); },
              blur: function (event) { commitScheduleBlockCourse(day, from, to, event.target); },
              keydown: function (event) { handleScheduleCourseKeydown(event, day, from, to); }
            }
          }),
          meta.room ? el("span", { class: "slot-block-room", text: meta.room }) : null
        ]),
        linkedUnit ? el("button", {
          type: "button", class: "btn btn-icon slot-block-link",
          "aria-label": "Abrir la unidad didáctica " + linkedUnit.name,
          on: { click: function (event) { event.stopPropagation(); openUnitModal(linkedUnit.id); } }
        }, [icon("chevron-right")]) : null,
        el("button", {
          type: "button", class: "btn btn-icon slot-block-edit",
          "aria-label": editLabel,
          on: { click: function (event) { event.stopPropagation(); openScheduleBlockEditor(day, from, to); } }
        }, [icon("edit")])
      ])
    ]);
  }

  // Persist the typed course name to the block. Matching an active-cycle unit is
  // a convenience, never a requirement: any other text is a valid plain label.
  function commitScheduleBlockCourse(day, from, to, input) {
    if (!input) return;
    var value = input.value.trim();
    var occupancy = scheduleSlotOccupancy(day);
    var meta = occupancy[from] || { unit: "", room: "" };
    if (value === (meta.unit || "")) return;
    applyScheduleBlockMeta(day, from, to, value, meta.room || "");
    saveState();
    var unit = value ? findUnitByName(value) : null;
    renderSchedule();
    if (unit) openUnitModal(unit.id);
  }

  function handleScheduleCourseKeydown(event, day, from, to) {
    if (event.key === "Enter") {
      event.preventDefault();
      event.stopPropagation();
      commitScheduleBlockCourse(day, from, to, event.target);
      event.target.blur();
    } else if (event.key === "Escape") {
      event.preventDefault();
      event.stopPropagation();
      var meta = scheduleSlotOccupancy(day)[from] || { unit: "" };
      event.target.value = meta.unit || "";
      event.target.blur();
    }
  }

  function scheduleBlockIsNow(day, startMinutes, endMinutes) {
    if (day !== todayScheduleDay()) return false;
    var now = new Date();
    var nowMinutes = now.getHours() * 60 + now.getMinutes();
    return nowMinutes >= startMinutes && nowMinutes < endMinutes;
  }

  // Entries that do not align to the 50-minute grid are never snapped or lost:
  // they are listed under the grid and left exactly as they were stored.
  function renderScheduleOffGrid(day) {
    var slots = scheduleSlotBounds();
    var custom = scheduleEntriesForDay(day).filter(function (entry) {
      return !scheduleEntrySlotSpan(entry, slots);
    });
    if (custom.length === 0) return null;

    var box = el("div", { class: "slot-offgrid" });
    box.appendChild(el("p", { class: "slot-offgrid-title", text: "Bloques fuera de la grilla (se conservan tal cual)" }));
    box.appendChild(el("p", { class: "helper", text: "Estos bloques no calzan en los cortes de 50 minutos, así que no se tocan al marcar casillas. Edítalos o impórtalos de nuevo si quieres reemplazarlos." }));
    custom.forEach(function (entry) { box.appendChild(scheduleEntryRow(entry, false)); });
    return box;
  }

  function focusScheduleSlot(day, index) {
    var rows = document.querySelectorAll("#screen-schedule .slot-row");
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (parseInt(row.dataset.day, 10) !== day) continue;
      var from = parseInt(row.dataset.from, 10);
      var to = parseInt(row.dataset.to, 10);
      if (index >= from && index < to) { row.focus(); return; }
    }
  }

  function renderScheduleToday() {
    var day = todayScheduleDay();
    var entries = scheduleEntriesForDay(day);
    var now = new Date();
    var nowMinutes = now.getHours() * 60 + now.getMinutes();
    var current = null;
    entries.forEach(function (entry) {
      if (current) return;
      var start = scheduleTimeToMinutes(entry.start);
      var end = scheduleTimeToMinutes(entry.end);
      if (start !== null && end !== null && nowMinutes >= start && nowMinutes < end) current = entry;
    });

    var card = el("section", { class: "card" });
    card.appendChild(el("span", { class: "field-label" }, [icon("clock", "icon-lead"), "Hoy · " + scheduleDayName(day)]));

    if (entries.length === 0) {
      var weekend = day === 6 || day === 7;
      card.appendChild(el("p", { class: "helper", text: weekend
        ? "Hoy es fin de semana y no tienes clases registradas. Descansa."
        : "No tienes clases registradas para hoy." }));
    } else {
      entries.forEach(function (entry) { card.appendChild(scheduleEntryRow(entry, entry === current)); });
    }
    return card;
  }

  // Reading view: a real timetable with a sticky time gutter on the left and one
  // column per day. Blocks span their rows; empty slots stay empty cells. This is
  // not the editing surface (the builder is), but a block cell is tappable and
  // opens the same block editor as a bonus.
  function renderScheduleTimetableCard() {
    var card = el("section", { class: "card" });
    card.appendChild(el("p", { class: "helper", text: "Vista de tabla de tu semana: los días van en columnas y cada fila es un bloque de 50 minutos. Desliza a los lados para ver todos los días; la columna de horas queda fija." }));
    card.appendChild(el("div", { class: "timetable-wrap" }, [renderScheduleTimetable()]));
    card.appendChild(el("div", { class: "timeline-legend" }, [
      el("span", { class: "legend-item" }, [
        el("span", { class: "legend-swatch", style: "background: var(--accent-soft); border-color: var(--accent);" }),
        "Bloque de clase"
      ]),
      el("span", { class: "legend-item" }, [
        el("span", { class: "legend-swatch" }),
        "Casilla libre"
      ])
    ]));

    var offGridCount = state.schedule.filter(function (entry) {
      return !scheduleEntrySlotSpan(entry, scheduleSlotBounds());
    }).length;
    if (offGridCount > 0) {
      card.appendChild(el("p", { class: "helper", text: offGridCount === 1
        ? "1 bloque fuera de la grilla no aparece en la tabla; se conserva en el armador."
        : offGridCount + " bloques fuera de la grilla no aparecen en la tabla; se conservan en el armador." }));
    }
    return card;
  }

  function renderScheduleTimetable() {
    var slots = scheduleSlotBounds();
    var startRuns = {};
    var covered = {};
    for (var day = 1; day <= 7; day++) {
      startRuns[day] = {};
      covered[day] = {};
      scheduleOccupancyRuns(scheduleSlotOccupancy(day)).forEach(function (run) {
        startRuns[day][run.from] = run;
        for (var index = run.from + 1; index < run.to; index++) covered[day][index] = true;
      });
    }

    var table = el("table", { class: "timetable" });
    table.appendChild(el("caption", { class: "sr-only", text: "Horario semanal: cada columna es un día y cada fila un bloque de 50 minutos." }));

    var headRow = el("tr");
    headRow.appendChild(el("th", { class: "timetable-gutter", scope: "col", text: "Hora" }));
    for (var headDay = 1; headDay <= 7; headDay++) {
      headRow.appendChild(el("th", { scope: "col", text: scheduleDayName(headDay) }));
    }
    table.appendChild(el("thead", {}, [headRow]));

    var tbody = el("tbody");
    for (var index = 0; index < slots.length; index++) {
      var row = el("tr");
      row.appendChild(el("th", { class: "timetable-gutter", scope: "row", text: slots[index].start }));
      for (var rowDay = 1; rowDay <= 7; rowDay++) {
        var run = startRuns[rowDay][index];
        if (run) {
          row.appendChild(scheduleTimetableBlockCell(rowDay, run, slots));
        } else if (!covered[rowDay][index]) {
          row.appendChild(el("td", { class: "timetable-cell-empty", "aria-hidden": "true" }));
        }
      }
      tbody.appendChild(row);
    }
    table.appendChild(tbody);
    return table;
  }

  function scheduleTimetableBlockCell(day, run, slots) {
    var startText = slots[run.from].start;
    var endText = slots[run.to - 1].end;
    var rangeText = startText + " - " + endText;
    var unitName = run.unit || "";
    var linkedUnit = unitName ? findUnitByName(unitName) : null;

    var content = el("button", {
      type: "button",
      class: "timetable-block-btn",
      "aria-label": scheduleDayName(day) + ", " + rangeText + ", " + (unitName || "sin curso") + ". Abrir el bloque",
      on: { click: function () { openScheduleBlockEditor(day, run.from, run.to); } }
    }, [
      el("span", { class: "timetable-block-time", text: rangeText }),
      unitName ? el("span", { class: "timetable-block-name", text: unitName }) : null,
      run.room ? el("span", { class: "timetable-block-room", text: run.room }) : null
    ]);

    return el("td", {
      class: "timetable-cell-block" + (linkedUnit ? " is-linked" : ""),
      rowspan: String(run.to - run.from)
    }, [content]);
  }

  // One schedule row. When the unit name matches an active cycle unit, the row
  // becomes a button that opens that unit's modal — the schedule/deadlines link.
  function scheduleEntryRow(entry, isNow) {
    var unit = findUnitByName(entry.unit);
    var meta = entry.unit || "Sin unidad";
    if (entry.room) meta += " · " + entry.room;
    // The user's own text wins over the parsed time, so an ambiguous hour is
    // never shown as a reinterpreted one.
    var timeText = entry.label ? entry.label : ((entry.start || "") + " - " + (entry.end || ""));

    var content = [
      el("span", { class: "schedule-time", text: timeText }),
      el("span", { class: "schedule-info" }, [
        el("span", { class: "schedule-unit", text: meta })
      ])
    ];

    if (isNow) {
      content.push(el("span", { class: "schedule-entry-chip" }, [renderChip("En curso", "accent", "clock")]));
    }

    var className = "schedule-entry" + (isNow ? " is-now" : "");

    if (unit) {
      content.push(el("span", { class: "schedule-link", "aria-hidden": "true" }, [icon("chevron-right")]));
      return el("button", {
        type: "button",
        class: className + " is-linked",
        "aria-label": "Abrir la unidad didáctica " + unit.name + (isNow ? ". En curso ahora" : ""),
        on: { click: function () { openUnitModal(unit.id); } }
      }, content);
    }
    return el("div", { class: className }, content);
  }

    ]));

    ]));

  function saveScheduleBlock() {
    if (!editingScheduleBlock) return;
    var day = editingScheduleBlock.day;
    var from = editingScheduleBlock.from;
    var to = editingScheduleBlock.to;
    var occupancy = scheduleSlotOccupancy(day);
    var currentUnit = occupancy[from] ? occupancy[from].unit : "";

  function handleScheduleParse() {
    var textarea = document.getElementById("schedulePaste");
    var text = textarea ? textarea.value : "";
    scheduleImportOpen = true;
    schedulePreviewSource = text;
    schedulePreview = parseScheduleText(text);
    renderSchedule();

  // Excel workbooks are ZIP archives: read the bytes and run the native reader.
  // Every failure mode is mapped to Spanish copy, never a crash.
  function handleExcelFile(file, input) {
    scheduleImportOpen = true;
    if (!supportsDeflateRaw()) {
      schedulePreview = null;
      schedulePreviewSource = "";
      input.value = "";
      renderSchedule();
      window.alert(xlsxErrorMessage("NO_DEFLATE"));
      return;
    }

    var reader = new FileReader();
    reader.onload = function () {
      readXlsxRows(reader.result).then(function (result) {
        schedulePreview = scheduleFromMatrix(result.matrix);
        schedulePreview.delimiter = null;
        schedulePreview.sheetName = result.sheetName;
        schedulePreviewSource = "";
        renderSchedule();
      }).catch(function (error) {
        schedulePreview = null;
        schedulePreviewSource = "";
        renderSchedule();
        window.alert(xlsxErrorMessage(error && error.code ? error.code : "CORRUPT"));
      });
    };
    reader.onerror = function () {
      schedulePreview = null;
      schedulePreviewSource = "";
      renderSchedule();
      window.alert(xlsxErrorMessage("CORRUPT"));
    };
    reader.readAsArrayBuffer(file);
  }

  function handleScheduleFile(event) {
    var input = event.target;
    var file = input.files && input.files[0];
    if (!file) return;
    scheduleImportOpen = true;

    if (/\.(xlsx|xlsm|xls)$/i.test(file.name || "")) {
      handleExcelFile(file, input);
      return;
    }

    var reader = new FileReader();
    reader.onload = function () {
      schedulePreviewSource = String(reader.result === null || reader.result === undefined ? "" : reader.result);
      schedulePreview = parseScheduleText(schedulePreviewSource);
      renderSchedule();
    };
    reader.onerror = function () {
      window.alert("No se pudo leer el archivo. Intenta pegando las filas en el área de texto.");
    };
    reader.readAsText(file);
  }

  function confirmScheduleImport() {
    if (!schedulePreview || schedulePreview.rows.length === 0) return;
    if (state.schedule.length > 0) {
      var message = "Se reemplazarán " + state.schedule.length +
        (state.schedule.length === 1 ? " clase registrada" : " clases registradas") +
        " por las " + schedulePreview.rows.length + " de la importación. ¿Continuar?";
      if (!window.confirm(message)) return;
    }
    state.schedule = schedulePreview.rows.map(normalizeScheduleEntry);
    schedulePreview = null;
    schedulePreviewSource = "";
    scheduleImportOpen = false;
    saveState();
    renderSchedule();
  }

  function clearSchedule() {
    if (state.schedule.length === 0) return;
    var message = "Se borrarán las " + state.schedule.length +
      (state.schedule.length === 1 ? " clase" : " clases") + " del horario. ¿Continuar?";
    if (!window.confirm(message)) return;
    state.schedule = [];
    schedulePreview = null;
    schedulePreviewSource = "";
    saveState();
    renderSchedule();
  }

  /* =========================================================

  function renderUnits() {

      var heading = el("div", { class: "block-heading" }, [

      units.forEach(function (unit) {

  function unitCard(unit) {

    ]);

  function openUnitModal(unitId) {
    activeUnitId = unitId;
    renderUnitModal();
    openModal(document.getElementById("unitModal"));
  }

  function renderUnitModal() {
    var unit = getUnit(activeUnitId);
    if (!unit) return;
    var now = new Date();

    document.getElementById("unitModalTitle").textContent = unit.name;
    document.getElementById("unitModalSub").textContent = TRACK_LABELS[unit.track] + " · " + unit.id.toUpperCase();

    var body = document.getElementById("unitModalBody");
    clear(body);

    body.appendChild(renderUnitGradeCard(unit));

    body.appendChild(el("h3", { class: "section-title", text: "Entregas de esta unidad" }));
    var deadlines = getSortedDeadlines().filter(function (d) { return d.unitId === unit.id; });
    if (deadlines.length === 0) {
      body.appendChild(emptyState(
        "inbox",
        "Sin entregas en esta unidad",
        "Cuando registres una entrega para " + unit.name + ", aparecerá aquí.",
        el("button", {
          type: "button", class: "btn btn-primary", text: "Nueva entrega",
          on: { click: function () { closeModal(document.getElementById("unitModal")); openDeadlineForm(null, unit.id); } }
        })
      ));
    } else {
      deadlines.forEach(function (deadline) {
        body.appendChild(deadlineCard(deadline, now, { inlineGrade: true }));
      });
    }
  }

  // Grade summary card for the unit modal. Keeps the three numbers distinct and
  // never normalises weights: any gap or overflow is surfaced before the numbers.
  function renderUnitGradeCard(unit) {
    var grade = computeUnitGrade(unitDeadlines(unit.id), state.target);
    var card = el("section", { class: "card", id: "unitGradeCard" }, [
      el("span", { class: "field-label" }, [icon("award", "icon-lead"), "Promedio de la unidad"])
    ]);

    if (grade.weightedTotal > 0 && grade.weightedTotal !== 100) {
      var delta = Math.round((grade.weightedTotal - 100) * 100) / 100;
      var weightMessage = delta > 0
        ? "Los pesos registrados suman " + formatNumber(grade.weightedTotal) + "%, más de 100%. Revísalos: el cálculo no los normaliza."
        : "Los pesos registrados suman " + formatNumber(grade.weightedTotal) + "%. Falta " + formatNumber(-delta) + "% para llegar a 100%.";
      card.appendChild(el("div", { class: "grade-note " + (delta > 0 ? "danger" : "warning") }, [
        icon("alert"),
        el("span", { text: weightMessage })
      ]));
    }

    if (!grade.hasAverage) {
      card.appendChild(el("div", { class: "grade-note" }, [
        icon("note"),
        el("span", { text: "Todavía no hay entregas con nota y peso en esta unidad. Registra ambas cosas y aquí verás tu promedio ponderado." })
      ]));
    } else {
      card.appendChild(el("div", { class: "grade-grid" }, [
        el("div", { class: "grade-stat" }, [
          el("span", { class: "grade-value", text: formatNumber(grade.average) }),
          el("span", { class: "grade-label", text: "Promedio de lo calificado" })
        ]),
        el("div", { class: "grade-stat" }, [
          el("span", { class: "grade-value", text: formatNumber(grade.aporte) }),
          el("span", { class: "grade-label", text: "Aporte acumulado" })
        ]),
        el("div", { class: "grade-stat" }, [
          el("span", { class: "grade-value", text: formatNumber(grade.pendiente) + "%" }),
          el("span", { class: "grade-label", text: "Pendiente de calificar" })
        ])
      ]));

      var targetLine;
      if (grade.finished) {
        targetLine = "Ya no queda peso por calificar. Tu promedio final es " + formatNumber(grade.average) + ".";
      } else if (grade.necesario !== null && grade.necesario > GRADE_SCALE_MAX) {
        targetLine = "Necesitarías " + formatNumber(grade.necesario) + " en lo que queda para llegar a " + formatNumber(grade.target) + ", pero el máximo es 20. Con estos pesos, la nota objetivo está fuera de alcance.";
      } else if (grade.necesario !== null && grade.necesario <= 0) {
        targetLine = "Ya tienes asegurada la nota objetivo " + formatNumber(grade.target) + ".";
      } else if (grade.necesario !== null) {
        targetLine = "Necesitás " + formatNumber(grade.necesario) + " en lo que queda para llegar a " + formatNumber(grade.target) + ".";
      } else {
        targetLine = "Los pesos superan 100%, así que no se puede calcular qué necesitas en lo que queda. Corrige los pesos.";
      }
      card.appendChild(el("p", { class: "grade-target", text: targetLine }));

      var targetChip = null;
      if (grade.finished) {
        targetChip = renderChip("Sin peso por calificar", "neutral", "check");
      } else if (grade.necesario !== null && grade.necesario > GRADE_SCALE_MAX) {
        targetChip = renderChip("Fuera de alcance", "danger", "alert");
      } else if (grade.necesario !== null && grade.necesario <= 0) {
        targetChip = renderChip("Asegurada", "success", "check");
      } else if (grade.necesario !== null) {
        targetChip = renderChip("Nota objetivo " + formatNumber(grade.target), "accent", "award");
      }
      if (targetChip) {
        card.appendChild(el("div", { class: "row", style: "margin-top: 8px;" }, [targetChip]));
      }

      card.appendChild(el("ul", { class: "grade-list" }, grade.scored.map(function (d) {
        return el("li", {}, [
          el("span", { class: "grade-list-title", text: d.title }),
          el("span", { class: "grade-list-meta", text: "Nota " + formatNumber(d.score) + " · " + formatNumber(d.weight) + "%" })
        ]);
      })));
    }

    if (grade.scoredWithoutWeight.length > 0) {
      var names = grade.scoredWithoutWeight.map(function (d) { return d.title; }).join(", ");
      card.appendChild(el("div", { class: "grade-note warning" }, [
        icon("alert"),
        el("span", { text: grade.scoredWithoutWeight.length === 1
          ? "Una entrega tiene nota pero no peso y no entra al promedio: " + names + ". Edítala para agregarle un peso."
          : grade.scoredWithoutWeight.length + " entregas tienen nota pero no peso y no entran al promedio: " + names + ". Edítalas para agregarles un peso." })
      ]));
    }

    return card;
  }

  /* =========================================================
     Deadline CRUD
     ========================================================= */
  function generateId() {
    return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function openDeadlineForm(deadlineId, presetUnitId) {
    editingDeadlineId = deadlineId || null;
    var form = document.getElementById("deadlineForm");
    form.reset();
    document.getElementById("deadlineFormError").style.display = "none";

    var unitSelect = document.getElementById("fieldUnit");
    clear(unitSelect);
    var units = activeUnits();
    units.forEach(function (unit) {
      unitSelect.appendChild(el("option", { value: unit.id, text: unit.name }));
    });

    var titleEl = document.getElementById("deadlineModalTitle");
    var submitEl = document.getElementById("deadlineFormSubmit");
    var existing = null;
    if (editingDeadlineId) {
      existing = state.deadlines.filter(function (d) { return d.id === editingDeadlineId; })[0] || null;
    }

    if (existing) {
      titleEl.textContent = "Editar entrega";
      submitEl.textContent = "Guardar cambios";
      document.getElementById("fieldTitle").value = existing.title;
      document.getElementById("fieldUnit").value = existing.unitId;
      var parts = existing.dueAt.split("T");
      document.getElementById("fieldDate").value = parts[0];
      document.getElementById("fieldTime").value = parts[1] || "23:59";
      document.getElementById("fieldWeight").value = existing.weight === null ? "" : String(existing.weight);
      document.getElementById("fieldScore").value = existing.score === null ? "" : String(existing.score);
      setFormStatus(existing.status);
    } else {
      titleEl.textContent = "Nueva entrega";
      submitEl.textContent = "Guardar entrega";
      document.getElementById("fieldUnit").value = presetUnitId || (units[0] ? units[0].id : "");
      var today = new Date();
      document.getElementById("fieldDate").value = toDateInputValue(today);
      document.getElementById("fieldTime").value = "23:59";
      setFormStatus("pending");
    }

    openModal(document.getElementById("deadlineModal"));
    window.setTimeout(function () { document.getElementById("fieldTitle").focus(); }, 60);
  }

  function setFormStatus(status) {
    formStatus = status === "submitted" ? "submitted" : "pending";
    var group = document.getElementById("fieldStatusGroup");
    Array.prototype.forEach.call(group.querySelectorAll("button"), function (button) {
      var isActive = button.dataset.status === formStatus;
      button.classList.toggle("active", isActive);
      button.setAttribute("aria-pressed", isActive ? "true" : "false");
    });
  }

  function handleDeadlineSubmit(event) {
    event.preventDefault();
    var errorEl = document.getElementById("deadlineFormError");
    var title = document.getElementById("fieldTitle").value.trim();
    var unitId = document.getElementById("fieldUnit").value;
    var dateValue = document.getElementById("fieldDate").value;
    var timeValue = document.getElementById("fieldTime").value || "23:59";
    var weightRaw = document.getElementById("fieldWeight").value.trim();
    var scoreRaw = document.getElementById("fieldScore").value.trim();

    if (title === "") {
      showFormError("Escribe un título para la entrega.");
      document.getElementById("fieldTitle").focus();
      return;
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
      showFormError("Elige una fecha válida.");
      document.getElementById("fieldDate").focus();
      return;
    }
    if (!/^\d{2}:\d{2}$/.test(timeValue)) {
      showFormError("Elige una hora válida.");
      document.getElementById("fieldTime").focus();
      return;
    }
    if (!unitExists(unitId)) {
      showFormError("Elige una unidad didáctica válida.");
      return;
    }

    var weight = null;
    if (weightRaw !== "") {
      var parsedWeight = parseFloat(weightRaw);
      if (!isFinite(parsedWeight) || parsedWeight < 0 || parsedWeight > 100) {
        showFormError("El peso debe estar entre 0 y 100.");
        document.getElementById("fieldWeight").focus();
        return;
      }
      weight = parsedWeight;
    }

    var score = null;
    if (scoreRaw !== "") {
      var parsedScore = parseFloat(scoreRaw);
      if (!isFinite(parsedScore) || parsedScore < 0 || parsedScore > GRADE_SCALE_MAX) {
        showFormError("La nota debe estar entre 0 y 20.");
        document.getElementById("fieldScore").focus();
        return;
      }
      score = parsedScore;
    }

    var dueAt = dateValue + "T" + timeValue;
    if (isNaN(new Date(dueAt).getTime())) {
      showFormError("La fecha y la hora no forman un momento válido.");
      return;
    }

    errorEl.style.display = "none";

    if (editingDeadlineId) {
      state.deadlines.forEach(function (deadline) {
        if (deadline.id === editingDeadlineId) {
          deadline.title = title;
          deadline.unitId = unitId;
          deadline.dueAt = dueAt;
          deadline.weight = weight;
          deadline.score = score;
          deadline.status = formStatus;
        }
      });
      // Editing a deadline re-arms its notification if it becomes relevant again.
      clearDeadlineNotified(editingDeadlineId);
    } else {
      state.deadlines.push({
        id: generateId(),
        unitId: unitId,
        title: title,
        dueAt: dueAt,
        status: formStatus,
        weight: weight,
        score: score
      });
    }

    saveState();
    closeModal(document.getElementById("deadlineModal"));
    renderAll();
  }

  function showFormError(message) {
    var errorEl = document.getElementById("deadlineFormError");
    errorEl.textContent = message;
    errorEl.style.display = "block";
  }

  function toggleDeadlineStatus(deadlineId) {
    state.deadlines.forEach(function (deadline) {
      if (deadline.id === deadlineId) {
        deadline.status = deadline.status === "submitted" ? "pending" : "submitted";
      }
    });
    saveState();
    renderAll();
    if (activeUnitId && document.getElementById("unitModal").classList.contains("open")) {
      renderUnitModal();
    }
  }

  function deleteDeadline(deadlineId) {
    var target = state.deadlines.filter(function (d) { return d.id === deadlineId; })[0];
    if (!target) return;
    if (!window.confirm("¿Eliminar la entrega \"" + target.title + "\"? Esta acción no se puede deshacer.")) return;
    state.deadlines = state.deadlines.filter(function (d) { return d.id !== deadlineId; });
    clearDeadlineNotified(deadlineId);
    saveState();
    renderAll();
    if (activeUnitId && document.getElementById("unitModal").classList.contains("open")) {
      renderUnitModal();
    }
  }

  /* =========================================================
     Settings actions
     ========================================================= */
  function handleProgramChange(programId) {
    var program = PROGRAMS[programId];
    if (!program) { renderSettings(); return; }
    // Clamp to the nearest valid cycle when the current one does not exist in the
    // new program (e.g. switching from a 6-cycle to a 4-cycle career).
    var cycles = programCycles(program);
    var cycleNumber = program.cycles[state.cycleNumber] ? state.cycleNumber : cycles[cycles.length - 1];
    applyCycleContext(programId, cycleNumber);
  }

  function handleCycleChange(cycleNumber) {
    applyCycleContext(state.programId, cycleNumber);
  }

  // Apply a new program/cycle. If the change would orphan saved deadlines, warn
  // first and only proceed on explicit confirmation. Declining leaves state
  // untouched, and renderSettings() rebuilds the selects from that state, so the
  // controls revert visually. On confirmation the orphaned deadlines are removed
  // (invisible data is worse than an explicit delete).
  function applyCycleContext(programId, cycleNumber) {
    var program = PROGRAMS[programId];
    if (!program || !program.cycles[cycleNumber]) { renderSettings(); return; }
    if (programId === state.programId && cycleNumber === state.cycleNumber) return;

    var nextUnits = deriveUnits(programId, cycleNumber);
    var nextIds = {};
    nextUnits.forEach(function (unit) { nextIds[unit.id] = true; });

    var orphaned = state.deadlines.filter(function (d) { return !nextIds[d.unitId]; });
    if (orphaned.length > 0) {
      var message = "Este cambio deja " + orphaned.length +
        (orphaned.length === 1 ? " entrega sin unidad válida" : " entregas sin unidad válida") +
        " en la malla nueva. Se eliminarán de forma permanente si continúas. ¿Continuar?";
      if (!window.confirm(message)) {
        renderSettings();
        return;
      }
      state.deadlines = state.deadlines.filter(function (d) { return nextIds[d.unitId]; });
    }

    state.programId = programId;
    state.cycleNumber = cycleNumber;
    saveState();
    renderHeader();
    renderSettings();
    renderDashboard();
  }

  function resetAllData() {
    if (!window.confirm("Se borrarán todas tus entregas y tu configuración. ¿Continuar?")) return;
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      // Ignore storage failures; memory reset still happens below.
    }
    state = defaultState();
    applyTheme();
    renderHeader();
    switchScreen("dashboard");
    renderAll();
  }

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", state.theme === "dark" ? "dark" : "light");
  }

  /* =========================================================
     Modal plumbing
     ========================================================= */
  var lastFocusedElement = null;

  // History integration: an open modal owns exactly one pushed history entry, so
  // the Android/browser back gesture dismisses the modal instead of leaving the
  // app. `historyModalLive` is true while that entry is still on the stack.
  // `historyReleaseTimer` defers the history.back() that removes the entry, which
  // lets a modal opening in the same tick (unit -> new deadline) reuse the entry
  // with replaceState instead of stacking a second one. `suppressPopstate`
  // swallows the popstate our own history.back() fires, so it never closes a
  // modal twice.
  var historyModalLive = false;
  var historyReleaseTimer = null;
  var suppressPopstate = false;

  function pushModalHistory(modalId) {
    if (historyModalLive) {
      // Entry already on the stack (e.g. switching modals): reuse it.
      if (historyReleaseTimer !== null) {
        window.clearTimeout(historyReleaseTimer);
        historyReleaseTimer = null;
      }
      try { history.replaceState({ tasktecModal: modalId }, ""); } catch (error) { /* history is optional */ }
      return;
    }
    historyModalLive = true;
    try {
      history.pushState({ tasktecModal: modalId }, "");
    } catch (error) {
      // Environments that reject pushState (some file:// contexts) simply keep
      // the modal working without history support.
      historyModalLive = false;
    }
  }

  function releaseModalHistory() {
    if (!historyModalLive || historyReleaseTimer !== null) return;
    historyReleaseTimer = window.setTimeout(function () {
      historyReleaseTimer = null;
      historyModalLive = false;
      suppressPopstate = true;
      history.back();
    }, 0);
  }

  function handlePopState() {
    if (suppressPopstate) {
      // This is the popstate our own history.back() produced: ignore it.
      suppressPopstate = false;
      return;
    }
    // The user pressed back while a modal was open: close it without touching
    // history again, since the entry is already gone.
    historyModalLive = false;
    if (historyReleaseTimer !== null) {
      window.clearTimeout(historyReleaseTimer);
      historyReleaseTimer = null;
    }
    closeOpenModal();
  }

  function openModal(modal) {
    lastFocusedElement = document.activeElement;
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    pushModalHistory(modal.id);
  }

  function closeModal(modal) {
    var wasOpen = modal.classList.contains("open");
    modal.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
      lastFocusedElement.focus();
    }
    if (modal.id === "unitModal") activeUnitId = null;
    if (modal.id === "deadlineModal") editingDeadlineId = null;
    if (modal.id === "scheduleBlockModal") editingScheduleBlock = null;
    if (wasOpen) releaseModalHistory();
  }

  function closeOpenModal() {
    var modals = document.querySelectorAll(".modal.open");
    if (modals.length === 0) return false;
    closeModal(modals[modals.length - 1]);
    return true;
  }

  /* =========================================================
     Navigation
     ========================================================= */
  function switchScreen(screenName) {
    activeScreen = screenName;
    ["dashboard", "deadlines", "schedule", "units", "settings"].forEach(function (name) {
      var section = document.getElementById("screen-" + name);
      section.classList.toggle("active", name === screenName);
      var tab = document.getElementById("tab-" + name);
      var isActive = name === screenName;
      tab.classList.toggle("active", isActive);
      tab.setAttribute("aria-selected", isActive ? "true" : "false");
    });
    renderAll();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function renderAll() {
    renderHeader();
    if (activeScreen === "dashboard") renderDashboard();
    else if (activeScreen === "deadlines") renderDeadlines();
    else if (activeScreen === "schedule") renderSchedule();
    else if (activeScreen === "units") renderUnits();
    else if (activeScreen === "settings") renderSettings();
  }

  /* =========================================================
     Live countdown — one interval, cleared on unload
     ========================================================= */
  var tickTimer = null;
  var lastRenderedDay = dayKey(new Date());

  function refreshLive() {
    var now = new Date();

    var dueNodes = document.querySelectorAll("[data-due]");
    Array.prototype.forEach.call(dueNodes, function (node) {
      var dueAt = node.dataset.due;
      var textEl = node.querySelector(".chip-text");
      if (textEl) textEl.textContent = countdownLabel(dueAt, now);
      node.className = "chip chip-" + countdownTone(dueAt, now) + " js-due";
    });

    if (currentMilestone && activeScreen === "dashboard") {
      var milestoneTime = document.getElementById("js-milestone-time");
      if (milestoneTime) {
        var gap = currentMilestone.date.getTime() - now.getTime();
        milestoneTime.textContent = gap <= 0 ? "En curso" : humanizeGap(gap);
      }
    }

    var todayKey = dayKey(now);
    if (todayKey !== lastRenderedDay) {
      lastRenderedDay = todayKey;
      if (!document.querySelector(".modal.open")) renderAll();
    }
  }

  function startTimer() {
    if (tickTimer !== null) window.clearInterval(tickTimer);
    tickTimer = window.setInterval(refreshLive, 1000);
  }

  /* =========================================================
     Bootstrap
     ========================================================= */
  // Injected from JS (like every other screen) so the raw HTML keeps zero new
  // static tags. The field sits right after the weight field in the form.
  function injectScoreField() {
    var weightInput = document.getElementById("fieldWeight");
    if (!weightInput || document.getElementById("fieldScore")) return;
    var weightField = weightInput.parentNode;
    var field = el("div", { class: "field" }, [
      el("label", { for: "fieldScore" }, ["Nota del docente (0 - 20) — opcional"]),
      el("input", {
        class: "input", type: "number", id: "fieldScore", name: "score",
        min: "0", max: "20", step: "0.5", inputmode: "decimal", placeholder: "Sin calificar"
      }),
      el("p", { class: "helper", text: "La nota que te dio el docente. Sin peso no entra al promedio ponderado." })
    ]);
    weightField.parentNode.insertBefore(field, weightField.nextSibling);
  }

  function bindStaticEvents() {
    injectScoreField();

    var tabs = document.querySelectorAll(".tab");
    Array.prototype.forEach.call(tabs, function (tab) {
      tab.addEventListener("click", function () { switchScreen(tab.dataset.screen); });
    });

    document.getElementById("unitModalBack").addEventListener("click", function () {
      closeModal(document.getElementById("unitModal"));
    });
    document.getElementById("unitModalClose").addEventListener("click", function () {
      closeModal(document.getElementById("unitModal"));
    });
    document.getElementById("deadlineModalBack").addEventListener("click", function () {
      closeModal(document.getElementById("deadlineModal"));
    });
    document.getElementById("deadlineModalClose").addEventListener("click", function () {
      closeModal(document.getElementById("deadlineModal"));
    });
    document.getElementById("scheduleBlockModalBack").addEventListener("click", function () {
      closeModal(document.getElementById("scheduleBlockModal"));
    });
    document.getElementById("scheduleBlockModalClose").addEventListener("click", function () {
      closeModal(document.getElementById("scheduleBlockModal"));
    });
    document.getElementById("deadlineFormCancel").addEventListener("click", function () {
      closeModal(document.getElementById("deadlineModal"));
    });
    document.getElementById("deadlineForm").addEventListener("submit", handleDeadlineSubmit);

    var statusGroup = document.getElementById("fieldStatusGroup");
    Array.prototype.forEach.call(statusGroup.querySelectorAll("button"), function (button) {
      button.addEventListener("click", function () { setFormStatus(button.dataset.status); });
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        if (closeOpenModal()) event.preventDefault();
      }
    });

    window.addEventListener("popstate", handlePopState);

    window.addEventListener("beforeunload", function () {
      if (tickTimer !== null) window.clearInterval(tickTimer);
      if (notificationTimer !== null) window.clearInterval(notificationTimer);
    });
  }

  function init() {
    loadState();
    applyTheme();
    injectPwaHead();
    registerServiceWorker();
    bindStaticEvents();
    switchScreen("dashboard");
    startTimer();
    startNotificationWatcher();
  }

  init();
})();
</script>
</body>
</html>
