<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TaskTec — tu ciclo en una pantalla</title>
<script>
  // Apply persisted theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var raw = localStorage.getItem("tasktec:v1");
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && (parsed.theme === "dark" || parsed.theme === "light")) {
          document.documentElement.setAttribute("data-theme", parsed.theme);
        }
      }
    } catch (error) {
      // Corrupt storage must never break the page.
    }
  })();
</script>
<style>
  /* =========================================================
     1. Design tokens — swap the whole palette from this block
     ========================================================= */
  :root {
    --bg: #f3f5fa;
    --bg-elevated: #ffffff;
    --surface: #ffffff;
    --surface-2: #eef1f7;
    --surface-3: #e4e9f2;
    --border: #d9e0ec;
    --border-strong: #c3cddd;

    --text: #151d29;
    --text-muted: #5b6879;
    --text-faint: #8794a6;

    --accent: #2f6df6;
    --accent-strong: #1c52cf;
    --accent-soft: #e3ebff;
    --accent-contrast: #ffffff;

    --success: #0f7a55;
    --success-soft: #d6f2e6;
    --warning: #a35a06;
    --warning-soft: #fdeac9;
    --danger: #bf2b2b;
    --danger-soft: #fbe0e0;

    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
    --shadow-md: 0 6px 18px rgba(16, 24, 40, 0.10);
    --radius: 14px;
    --radius-sm: 10px;
    --radius-pill: 999px;

    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
            "Apple Color Emoji", "Segoe UI Emoji", sans-serif;

    color-scheme: light;
  }

  html[data-theme="dark"] {
    --bg: #0c1016;
    --bg-elevated: #141a23;
    --surface: #141a23;
    --surface-2: #1b222d;
    --surface-3: #232c39;
    --border: #2a3341;
    --border-strong: #3a4556;

    --text: #e9eef7;
    --text-muted: #9aa7ba;
    --text-faint: #6f7d92;

    --accent: #6b93ff;
    --accent-strong: #8ba9ff;
    --accent-soft: #1b2740;
    --accent-contrast: #0c1016;

    --success: #4fd1a0;
    --success-soft: #12362a;
    --warning: #f0b64b;
    --warning-soft: #3a2d12;
    --danger: #ff8080;
    --danger-soft: #3a1d1d;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.5);

    color-scheme: dark;
  }

  /* =========================================================
     2. Base
     ========================================================= */
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  button, input, select, textarea { font: inherit; color: inherit; }

  button { cursor: pointer; }

  a { color: var(--accent); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* =========================================================
     2b. Icons — inline SVG sprite, no external assets
     ========================================================= */
  .icon {
    width: 1em;
    height: 1em;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: -0.125em;
  }

  .icon-lg { width: 1.35em; height: 1.35em; }
  .icon-lead { margin-right: 6px; }

  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* =========================================================
     3. App shell
     ========================================================= */
  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px calc(84px + env(safe-area-inset-bottom, 0px));
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 16px 12px;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .brand-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-logo {
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.5px;
  }

  .brand-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .brand-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.2;
  }

  .header-chip {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 5px 11px;
    white-space: nowrap;
  }

  /* =========================================================
     4. Screens
     ========================================================= */
  .screen { display: none; padding-top: 16px; }
  .screen.active { display: block; animation: fade-in 0.18s ease; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  /* =========================================================
     5. Cards & typography
     ========================================================= */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }

  .card + .card { margin-top: 14px; }

  .section-title {
    margin: 22px 4px 10px;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-faint);
  }

  .section-title:first-child { margin-top: 4px; }

  .muted { color: var(--text-muted); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }

  /* =========================================================
     6. Dashboard hero
     ========================================================= */
  .hero { text-align: left; }

  .hero-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .hero-program {
    margin: 4px 0 14px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .week-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .week-number {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .week-caption {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .progress {
    margin-top: 14px;
    height: 10px;
    border-radius: var(--radius-pill);
    background: var(--surface-3);
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg, var(--accent), var(--accent-strong));
    transition: width 0.4s ease;
  }

  .progress-legend {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .phase-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    font-size: 14px;
    font-weight: 600;
  }

  .phase-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    flex: 0 0 auto;
  }

  .phase-dot.finals { background: var(--warning); }

  /* =========================================================
     7. Milestone & alerts
     ========================================================= */
  .milestone {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .milestone-label {
    font-size: 13px;
    color: var(--text-muted);
  }

  .milestone-value {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .alert {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border-radius: var(--radius);
    padding: 13px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid transparent;
  }

  .alert-warning {
    background: var(--warning-soft);
    color: var(--warning);
    border-color: color-mix(in srgb, var(--warning) 30%, transparent);
  }

  .alert-danger {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: color-mix(in srgb, var(--danger) 30%, transparent);
  }

  .alert-icon { flex: 0 0 auto; font-size: 16px; line-height: 1.3; }

  /* =========================================================
     8. Chips & badges
     ========================================================= */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1;
    padding: 5px 9px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .chip-accent  { background: var(--accent-soft);  color: var(--accent-strong); border-color: color-mix(in srgb, var(--accent) 28%, transparent); }
  .chip-success { background: var(--success-soft); color: var(--success);       border-color: color-mix(in srgb, var(--success) 28%, transparent); }
  .chip-warning { background: var(--warning-soft); color: var(--warning);       border-color: color-mix(in srgb, var(--warning) 28%, transparent); }
  .chip-danger  { background: var(--danger-soft);  color: var(--danger);        border-color: color-mix(in srgb, var(--danger) 28%, transparent); }
  .chip-neutral { background: var(--surface-2);    color: var(--text-muted); }

  /* =========================================================
     9. Buttons
     ========================================================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .btn:active { transform: scale(0.975); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }

  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }

  .btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: transparent; }
  .btn-danger:hover { background: var(--danger-soft); }

  .btn-block { width: 100%; }

  .btn-sm { padding: 7px 11px; font-size: 13px; border-radius: 9px; }

  .btn-icon {
    padding: 8px;
    width: 34px; height: 34px;
    border-radius: 9px;
    background: transparent;
    border-color: transparent;
    color: var(--text-muted);
  }
  .btn-icon:hover { background: var(--surface-2); color: var(--text); }

  .actions-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* =========================================================
     10. Deadlines
     ========================================================= */
  .deadline {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    box-shadow: var(--shadow-sm);
  }

  .deadline + .deadline { margin-top: 10px; }
  .deadline.is-overdue  { border-left-color: var(--danger); }
  .deadline.is-soon     { border-left-color: var(--warning); }
  .deadline.is-submitted { border-left-color: var(--success); opacity: 0.82; }

  .deadline-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .deadline-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .deadline.is-submitted .deadline-title { text-decoration: line-through; text-decoration-color: var(--text-faint); }

  .deadline-meta {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
  }

  .deadline-chips {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .deadline-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }

  .deadline-actions .spacer { flex: 1 1 auto; }

  /* =========================================================
     11. Filters (segmented)
     ========================================================= */
  .filters {
    display: flex;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 4px;
    margin-bottom: 14px;
  }

  .filter-btn {
    flex: 1 1 0;
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 6px;
    border-radius: var(--radius-pill);
    transition: background 0.15s ease, color 0.15s ease;
  }

  .filter-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  /* =========================================================
     12. Units
     ========================================================= */
  .block-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 20px 4px 10px;
  }

  .block-heading:first-child { margin-top: 4px; }

  .block-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  .block-count {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 2px 8px;
  }

  .unit-card {
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s ease, transform 0.08s ease;
  }

  .unit-card + .unit-card { margin-top: 10px; }
  .unit-card:hover { border-color: var(--border-strong); }
  .unit-card:active { transform: scale(0.99); }

  .unit-name {
    font-size: 14.5px;
    font-weight: 700;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .unit-stats {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 7px;
    flex-wrap: wrap;
  }

  .unit-chevron { flex: 0 0 auto; color: var(--text-faint); font-size: 18px; }

  /* =========================================================
     13. Timeline strip
     ========================================================= */
  .timeline {
    display: flex;
    gap: 3px;
    align-items: stretch;
  }

  .tl-week {
    flex: 1 1 0;
    min-width: 0;
    position: relative;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 0 7px;
    font-variant-numeric: tabular-nums;
  }

  .tl-week .tl-dot {
    display: block;
    width: 4px; height: 4px;
    border-radius: 50%;
    margin: 4px auto 0;
    background: transparent;
  }

  .tl-week.past { opacity: 0.42; }

  .tl-week.current {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .tl-week.theory .tl-dot { background: var(--accent); }
  .tl-week.theory.current .tl-dot { background: var(--accent-contrast); }

  .tl-week.final {
    background: var(--warning-soft);
    border-color: color-mix(in srgb, var(--warning) 35%, transparent);
    color: var(--warning);
  }

  .tl-week.final .tl-dot { background: var(--warning); }

  .timeline-legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .legend-item { display: inline-flex; align-items: center; gap: 5px; }

  .legend-swatch {
    width: 10px; height: 10px;
    border-radius: 3px;
    border: 1px solid var(--border);
    display: inline-block;
  }

  /* =========================================================
     14. Forms
     ========================================================= */
  .field { margin-bottom: 16px; }

  .field label,
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .input, .select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    font-size: 15px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input:focus, .select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    outline: none;
  }

  .helper {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .field-row {
    display: flex;
    gap: 10px;
  }

  .field-row > .field { flex: 1 1 0; margin-bottom: 0; }

  .segmented {
    display: flex;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 4px;
  }

  .segmented button {
    flex: 1 1 0;
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px;
    border-radius: var(--radius-pill);
  }

  .segmented button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  /* =========================================================
     15. Empty states
     ========================================================= */
  .empty {
    text-align: center;
    padding: 26px 18px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text-muted);
  }

  .empty-icon { font-size: 26px; line-height: 1; margin-bottom: 8px; }
  .empty-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
  .empty-text { font-size: 13.5px; line-height: 1.45; margin: 0 auto 14px; max-width: 34ch; }

  /* =========================================================
     16. Modal
     ========================================================= */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    flex-direction: column;
    background: var(--bg);
  }

  .modal.open { display: flex; animation: fade-in 0.16s ease; }

  .modal-sheet {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .modal-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .modal-head-text { flex: 1 1 auto; min-width: 0; }

  .modal-title {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .modal-sub {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .modal-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    -webkit-overflow-scrolling: touch;
  }

  /* =========================================================
     17b. Unit grade summary (assignment scores, weighted)
     ========================================================= */
  .grade-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 12px 0;
  }

  .grade-stat {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    text-align: center;
  }

  .grade-value {
    display: block;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .grade-label {
    display: block;
    margin-top: 4px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
    line-height: 1.25;
  }

  .grade-target {
    margin: 0;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.4;
  }

  .grade-note {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 12.5px;
    line-height: 1.4;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .grade-note .icon { margin-top: 2px; }
  .grade-note.warning { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
  .grade-note.danger  { background: var(--danger-soft);  color: var(--danger);  border-color: color-mix(in srgb, var(--danger) 30%, transparent); }

  .grade-list {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
  }

  .grade-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 0;
    border-top: 1px dashed var(--border);
    font-size: 13px;
  }

  .grade-list li:first-child { border-top: 0; }

  .grade-list-title { font-weight: 600; overflow-wrap: anywhere; }
  .grade-list-meta { color: var(--text-muted); font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* =========================================================
     17c. Inline grade entry (on the row, no form)
     ========================================================= */
  .inline-grade {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }

  .inline-grade-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .inline-grade-input {
    width: 88px;
    max-width: 88px;
    padding: 7px 9px;
    font-size: 14px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .inline-grade-max {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .inline-grade-note {
    flex: 1 1 100%;
    margin: 2px 0 0;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--warning);
  }

  /* =========================================================
     17d. Class schedule (horario)
     ========================================================= */
  .schedule-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    font: inherit;
    color: inherit;
  }

  .schedule-entry + .schedule-entry { margin-top: 8px; }

  button.schedule-entry { cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  button.schedule-entry:hover { border-color: var(--accent); }
  button.schedule-entry:active { transform: scale(0.99); }
  .schedule-entry.is-linked { border-left-color: var(--accent); background: var(--accent-soft); }

  .schedule-time {
    flex: 0 0 auto;
    font-size: 12.5px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
  }

  .schedule-info { flex: 1 1 auto; min-width: 0; }

  .schedule-unit {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .schedule-link { flex: 0 0 auto; color: var(--accent); }

  .schedule-day + .schedule-day {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }

  .schedule-day:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

  .schedule-day-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .schedule-day-name { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
  .schedule-day-count { font-size: 11.5px; font-weight: 700; color: var(--text-muted); }
  .schedule-day-empty { margin: 0; font-size: 12.5px; color: var(--text-faint); }

  .schedule-paste {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }

  .schedule-preview {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }

  .schedule-preview-list,
  .schedule-error-list {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
  }

  .schedule-preview-list li,
  .schedule-error-list li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 0;
    border-top: 1px dashed var(--border);
    font-size: 12.5px;
  }

  .schedule-preview-list li:first-child,
  .schedule-error-list li:first-child { border-top: 0; }

  .schedule-preview-day { flex: 0 0 84px; font-weight: 700; }
  .schedule-preview-text { flex: 1 1 auto; overflow-wrap: anywhere; }

  .schedule-error-list li { color: var(--danger); font-weight: 600; }

  .schedule-preview-warning {
    flex: 0 0 100%;
    font-size: 12px;
    font-weight: 600;
    color: var(--warning);
  }

  /* =========================================================
     17e. Schedule builder (absolute 50-minute slot grid)
     ========================================================= */
  .builder-daybar {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }

  .builder-day {
    flex: 1 1 0;
    min-width: 0;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    padding: 9px 2px;
    border-radius: var(--radius-pill);
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .builder-day[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }

  .slot-list { display: flex; flex-direction: column; gap: 6px; }

  .slot-row {
    display: flex;
    align-items: stretch;
    gap: 0;
    width: 100%;
    text-align: left;
    border: 1px dashed var(--border-strong);
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 0;
    overflow: hidden;
    font: inherit;
  }

  .slot-time {
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    padding: 13px 4px;
    white-space: nowrap;
  }

  .slot-body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
  }

  button.slot-row { cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  button.slot-row:hover { border-color: var(--accent); }
  button.slot-row:active { transform: scale(0.99); }

  .slot-row.slot-empty .slot-time { color: var(--text-faint); }
  .slot-empty-text { font-size: 13px; color: var(--text-faint); }

  .slot-row.slot-block {
    border-style: solid;
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .slot-row.slot-block .slot-time {
    background: var(--accent);
    color: var(--accent-contrast);
    border-right-color: var(--accent);
  }

  .slot-block-info { flex: 1 1 auto; min-width: 0; }
  .slot-block-unit { display: block; font-size: 13.5px; font-weight: 700; overflow-wrap: anywhere; }
  .slot-block-room { display: block; margin-top: 2px; font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; }
  .slot-block-link { flex: 0 0 auto; color: var(--accent-strong); }

  .slot-row.is-now { box-shadow: 0 0 0 2px var(--accent); }

  .slot-offgrid { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .slot-offgrid-title { margin: 0 0 4px; font-size: 12.5px; font-weight: 700; color: var(--warning); }

  .slot-chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

  .slot-chip {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size: 12.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 8px 11px;
    border-radius: var(--radius-pill);
  }

  .schedule-entry.is-now { box-shadow: 0 0 0 2px var(--accent); }
  .schedule-entry-chip { flex: 0 0 auto; }

  /* =========================================================
     17f. Schedule builder — inline course name on the block
     ========================================================= */
  .slot-block-course {
    width: 100%;
    padding: 6px 8px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
  }

  .slot-row.slot-block { cursor: pointer; }
  .slot-row.slot-block.is-linked { border-left-color: var(--accent); }

  .slot-block-link,
  .slot-block-edit { flex: 0 0 auto; }

  /* =========================================================
     17g. Timetable (reading view below the builder)
     ========================================================= */
  .timetable-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }

  .timetable {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 560px;
    font-size: 12px;
  }

  .timetable th,
  .timetable td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 4px 6px;
    vertical-align: top;
    text-align: left;
    height: 28px;
  }

  .timetable tbody tr:last-child th,
  .timetable tbody tr:last-child td { border-bottom: 0; }

  .timetable thead th {
    position: sticky;
    top: 0;
    z-index: 3;
    background: var(--surface-2);
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .timetable .timetable-gutter {
    position: sticky;
    left: 0;
    z-index: 2;
    width: 54px;
    min-width: 54px;
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .timetable thead .timetable-gutter { z-index: 4; }

  .timetable-cell-empty { background: var(--surface); }

  .timetable-cell-block { background: var(--accent-soft); padding: 0; }
  .timetable-cell-block.is-linked { background: var(--accent-soft); }

  .timetable-block-btn {
    display: block;
    width: 100%;
    min-height: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    text-align: left;
    padding: 4px 6px;
    font: inherit;
  }

  .timetable-block-btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

  .timetable-block-time {
    display: block;
    font-size: 10.5px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent-strong);
  }

  .timetable-block-name {
    display: block;
    margin-top: 2px;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .timetable-block-room {
    display: block;
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
  }

  /* =========================================================
     18. Bottom tabs
     ========================================================= */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 30;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .tabbar-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: stretch;
  }

  .tab {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    border: 0;
    background: transparent;
    color: var(--text-faint);
    padding: 9px 2px 10px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    transition: color 0.15s ease;
  }

  .tab .tab-icon { font-size: 19px; line-height: 1; }
  .tab.active { color: var(--accent); }

  .tab.active .tab-icon { transform: translateY(-1px); }

  /* =========================================================
     19. Utilities & responsive
     ========================================================= */
  .row { display: flex; align-items: center; gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stack-8 > * + * { margin-top: 8px; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }
  .divider { height: 1px; background: var(--border); border: 0; margin: 16px 0; }

  @media (min-width: 560px) {
    .week-number { font-size: 48px; }
    .tl-week { font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>

    } catch (error) {
      return;
    }
    if (!raw) return;

    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (error) {
      return;
    }
    if (!parsed || typeof parsed !== "object") return;

    if (parsed.campus === "Lima" || parsed.campus === "Arequipa" || parsed.campus === "Trujillo") {
      state.campus = parsed.campus;
    }
    if (typeof parsed.startDate === "string" && /^\d{4}-\d{2}-\d{2}$/.test(parsed.startDate)) {
      state.startDate = parsed.startDate;
    }
    // Missing or invalid cycle length falls back to the real default (17). Loaded
    // before the theory weeks so their validation uses the configured cycle length.
    state.totalWeeks = sanitizeTotalWeeks(parsed.totalWeeks);
    if (Array.isArray(parsed.theoryAssessmentWeeks)) {

    if (parsed.theme === "dark" || parsed.theme === "light") {

    // to the 0-20 scale so a hand-edited store can never poison the math.
    if (typeof parsed.target === "number" && isFinite(parsed.target)) {
      state.target = clampTarget(parsed.target);

    if (typeof parsed.programId === "string" && PROGRAMS[parsed.programId]) {
      state.programId = parsed.programId;
    }
    var loadedCycles = programCycles(PROGRAMS[state.programId]);
    var loadedCycle = parseInt(parsed.cycleNumber, 10);
    if (isFinite(loadedCycle) && PROGRAMS[state.programId].cycles[loadedCycle]) {

    } else if (loadedCycles.length > 0 && !PROGRAMS[state.programId].cycles[state.cycleNumber]) {
      state.cycleNumber = loadedCycles[loadedCycles.length - 1];

      var units = activeUnits();

      Object.keys(parsed.notified).forEach(function (key) {

      });

    // written back and the user's data never depends on a later action.

    var legacyUnits = deriveUnits(DEFAULT_PROGRAM_ID, LEGACY_UNIT_CYCLE);

  function sanitizeWeeks(list) {
    var seen = {};
    return list
      .map(function (value) { return parseInt(value, 10); })
      .filter(function (value) {
        if (!isFinite(value) || value < 1 || value > state.totalWeeks) return false;
        if (seen[value]) return false;
        seen[value] = true;
        return true;
      })
      .sort(function (a, b) { return a - b; });
  }

  // (hand-edited store, corrupt data) falls back to the real default.
  function sanitizeTotalWeeks(value) {
    var parsed = parseInt(value, 10);
    if (!isFinite(parsed) || parsed < MIN_TOTAL_WEEKS || parsed > MAX_TOTAL_WEEKS) {
      return CYCLE.totalWeeks;

  /* =========================================================
     Class schedule (horario) — data model
     ========================================================= */
  // A schedule entry: { day: 1..7 (Mon..Sun), start: "HH:MM", end: "HH:MM",
  // unit: string, room: string }. Times are 24-hour strings; day is numeric so
  // ordering never depends on locale.
  var SCHEDULE_DAY_NAMES = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  var SCHEDULE_DAY_SHORT = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];

  function scheduleDayName(day) {
    return SCHEDULE_DAY_NAMES[day - 1] || "";
  }

  // null when the text was not a readable time. Either a real time pair or a
  // label is enough for the entry to be valid, so a label-only row never drops.
  function isValidScheduleEntry(entry) {
    if (!entry || typeof entry !== "object") return false;
    if (typeof entry.day !== "number" || entry.day < 1 || entry.day > 7) return false;
    var hasTimes = typeof entry.start === "string" && /^\d{2}:\d{2}$/.test(entry.start) &&
      typeof entry.end === "string" && /^\d{2}:\d{2}$/.test(entry.end);
    var hasLabel = typeof entry.label === "string" && entry.label.trim() !== "";
    return hasTimes || hasLabel;
  }

  function normalizeScheduleEntry(entry) {
    return {
      day: entry.day,
      start: typeof entry.start === "string" ? entry.start : null,
      end: typeof entry.end === "string" ? entry.end : null,
      unit: typeof entry.unit === "string" ? entry.unit.trim() : "",
      room: typeof entry.room === "string" ? entry.room.trim() : "",
      label: typeof entry.label === "string" && entry.label.trim() !== "" ? entry.label.trim() : null
    };
  }

  /* =========================================================
     Class schedule (horario) — builder slot grid
     ========================================================= */
  // Tecsup class blocks are 50 minutes long and the enrolled day runs from
  // 08:00 to 21:20 (800 minutes = 16 blocks). Verified against the user's own
  // schedule export: every observed block starts and ends on one of these
  // boundaries, so the whole day is a fixed grid of 16 slots. The three
  // constants below are the only numbers that define the grid.
  var SCHEDULE_BLOCK_START = "08:00";
  var SCHEDULE_BLOCK_MINUTES = 50;
  var SCHEDULE_BLOCK_COUNT = 16;

  function scheduleTimeToMinutes(value) {
    if (typeof value !== "string") return null;
    var match = value.match(/^(\d{1,2}):(\d{2})$/);
    if (!match) return null;
    var hour = parseInt(match[1], 10);
    var minute = parseInt(match[2], 10);
    if (hour > 23 || minute > 59) return null;
    return hour * 60 + minute;
  }

  // Derive the 16 slots from the three constants so changing the grid later is
  // a data-only edit.
  function scheduleSlotBounds() {
    var base = scheduleTimeToMinutes(SCHEDULE_BLOCK_START);
    var slots = [];
    for (var index = 0; index < SCHEDULE_BLOCK_COUNT; index++) {
      var startMinutes = base + index * SCHEDULE_BLOCK_MINUTES;
      var endMinutes = startMinutes + SCHEDULE_BLOCK_MINUTES;
      slots.push({
        index: index,
        start: minutesToScheduleTime(startMinutes),
        end: minutesToScheduleTime(endMinutes),
        startMinutes: startMinutes,
        endMinutes: endMinutes
      });
    }
    return slots;
  }

  // Which slots an entry covers, or null when it does not align to the grid
  // (out of range, partial slot, backwards interval). Non-aligned entries are
  // kept untouched instead of being snapped or dropped.
  function scheduleEntrySlotSpan(entry, slots) {
    if (!entry || typeof entry.start !== "string" || typeof entry.end !== "string") return null;
    if (!/^\d{2}:\d{2}$/.test(entry.start) || !/^\d{2}:\d{2}$/.test(entry.end)) return null;
    var start = scheduleTimeToMinutes(entry.start);
    var end = scheduleTimeToMinutes(entry.end);
    if (start === null || end === null || end <= start) return null;
    var base = slots[0].startMinutes;
    if ((start - base) % SCHEDULE_BLOCK_MINUTES !== 0) return null;
    if ((end - start) % SCHEDULE_BLOCK_MINUTES !== 0) return null;
    var from = (start - base) / SCHEDULE_BLOCK_MINUTES;
    var to = (end - base) / SCHEDULE_BLOCK_MINUTES;
    if (from < 0 || to > slots.length || from >= to) return null;
    return { from: from, to: to };

  // win on overlap. Slots outside any entry stay null.

    var occupancy = [];
    for (var i = 0; i < slots.length; i++) occupancy.push(null);
    scheduleEntriesForDay(day).forEach(function (entry) {
      var span = scheduleEntrySlotSpan(entry, slots);
      if (!span) return;

      }
    });
    return occupancy;

  // break when the unit or the room changes, so per-block metadata is preserved.
  function scheduleOccupancyRuns(occupancy) {

    while (index < occupancy.length) {

      var end = index;

      index = end + 1;

    }

  /* =========================================================

     ========================================================= */
  // TaskTec ships zero external libraries. An .xlsx is a ZIP of XML, so the
  // native reader further below covers Excel without adding a dependency. The
  // text path stays for CSV/TSV files and for pasted rows copied from Excel or
  // Google Sheets, which arrive tab-separated.
  var SCHEDULE_DAY_TOKENS = {
    lunes: 1, martes: 2, miercoles: 3, jueves: 4, viernes: 5, sabado: 6, domingo: 7
  };

  var SCHEDULE_COLUMN_ALIASES = {
    day: ["dia", "day"],
    start: ["inicio", "hora inicio", "desde", "start"],
    end: ["fin", "hora fin", "hasta", "end"],
    unit: ["unidad", "curso", "materia", "asignatura", "unidad didactica"],
    room: ["ambiente", "aula", "salon", "room"]

  // Lowercase and strip combining accents so "Día", "día" and "dia" all match.
  function stripAccents(value) {
    return String(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function normalizeToken(value) {
    return stripAccents(String(value).trim().toLowerCase()).replace(/\s+/g, " ");
  }

  // Pick the delimiter from the first non-empty line by counting candidates
  // outside quoted fields.
  function detectScheduleDelimiter(line) {
    var counts = { ",": 0, ";": 0, "\t": 0 };
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (ch === '"') inQuotes = !inQuotes;
      else if (!inQuotes && (ch === "," || ch === ";" || ch === "\t")) counts[ch] += 1;
    }
    var best = ",";
    var bestCount = 0;
    [",", ";", "\t"].forEach(function (delimiter) {
      if (counts[delimiter] > bestCount) { bestCount = counts[delimiter]; best = delimiter; }
    });
    return best;
  }

  // Split a delimited line, honouring double-quoted fields ("" is a literal quote).
  function splitScheduleLine(line, delimiter) {
    var fields = [];
    var current = "";
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (inQuotes) {
        if (ch === '"') {
          if (line.charAt(i + 1) === '"') { current += '"'; i += 1; }
          else inQuotes = false;
        } else {
          current += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === delimiter) {
        fields.push(current);
        current = "";
      } else {
        current += ch;
      }
    }
    fields.push(current);
    return fields;
  }

  function normalizeScheduleTime(raw) {
    var value = String(raw).trim().toLowerCase().replace(/\s+/g, "");
    if (value === "") return null;

    if (!match) return null;
    var hour = parseInt(match[1], 10);

    if (hour > 23 || minute > 59) return null;
    return pad2(hour) + ":" + pad2(minute);

    for (var i = 0; i < items.length; i++) strings.push(concatenateTextRuns(items[i]));
    return strings;
  }

  // "D4" -> 3, "AA10" -> 26. Column letters can exceed Z.
  function columnIndexFromRef(ref) {
    var match = /^([A-Za-z]+)[0-9]+$/.exec(String(ref));
    if (!match) return -1;
    var letters = match[1].toUpperCase();
    var index = 0;
    for (var i = 0; i < letters.length; i++) index = index * 26 + (letters.charCodeAt(i) - 64);
    return index - 1;
  }

  function readCellValue(cell, sharedStrings) {
    var type = cell.getAttribute("t") || "";
    var text;
    if (type === "inlineStr") {
      var inlineNodes = cell.getElementsByTagName("is");
      text = inlineNodes.length === 0 ? "" : concatenateTextRuns(inlineNodes[0]);
      return repairMojibake(text);
    }
    var raw = "";
    var valueNodes = cell.getElementsByTagName("v");
    if (valueNodes.length > 0) raw = valueNodes[0].textContent || "";
    if (type === "s") {
      var index = parseInt(raw, 10);
      if (!isFinite(index) || index < 0 || index >= sharedStrings.length) return "";
      return repairMojibake(sharedStrings[index]);
    }
    if (type === "b") return raw === "1" ? "TRUE" : "FALSE";
    // "str" and no-t (numeric) both keep the <v> text as-is.
    return repairMojibake(raw);
  }

  // Cells are sparse: place each <c> by its r attribute, never by document order.
  function parseWorksheetMatrix(xmlText, sharedStrings) {
    var doc = parseXml(xmlText);
    if (!doc) throw xlsxError("CORRUPT");
    var matrix = [];
    var rowNodes = doc.getElementsByTagName("row");
    for (var i = 0; i < rowNodes.length; i++) {
      var rowNode = rowNodes[i];
      var rowIndex = parseInt(rowNode.getAttribute("r"), 10);
      if (!isFinite(rowIndex) || rowIndex < 1) rowIndex = i + 1;
      var cells = [];
      var cellNodes = rowNode.getElementsByTagName("c");
      for (var j = 0; j < cellNodes.length; j++) {
        var cell = cellNodes[j];
        var column = columnIndexFromRef(cell.getAttribute("r") || "");
        if (column < 0) column = j;
        if (column > 16383) throw xlsxError("CORRUPT");
        cells[column] = readCellValue(cell, sharedStrings);
      }
      for (var k = 0; k < cells.length; k++) {
        if (cells[k] === undefined) cells[k] = "";
      }
      matrix[rowIndex - 1] = cells;
    }
    for (var r = 0; r < matrix.length; r++) {
      if (!matrix[r]) matrix[r] = [];
    }
    return matrix;
  }

  // Resolve "worksheets/sheet1.xml" from the workbook relationship when possible;
  // otherwise fall back to the conventional first-sheet path.
  function normalizeZipPath(base, target) {
    if (!target) return "";
    var joined = target.charAt(0) === "/" ? target.slice(1) : base + target;
    var parts = joined.split("/");
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (part === "" || part === ".") continue;
      if (part === "..") { if (out.length > 0) out.pop(); }
      else out.push(part);
    }
    return out.join("/");
  }

  async function resolveFirstSheet(entries) {
    var fallback = { path: "xl/worksheets/sheet1.xml", name: "" };
    var workbookXml = await readEntryText(entries, "xl/workbook.xml");
    if (!workbookXml) return fallback;
    var workbook = parseXml(workbookXml);
    if (!workbook) return fallback;
    var sheets = workbook.getElementsByTagName("sheet");
    if (sheets.length === 0) return fallback;
    var name = sheets[0].getAttribute("name") || "";
    var relationshipId = sheets[0].getAttribute("r:id") || "";
    if (!relationshipId) return { path: fallback.path, name: name };
    var relsXml = await readEntryText(entries, "xl/_rels/workbook.xml.rels");
    if (!relsXml) return { path: fallback.path, name: name };
    var rels = parseXml(relsXml);
    if (!rels) return { path: fallback.path, name: name };
    var relationships = rels.getElementsByTagName("Relationship");
    for (var i = 0; i < relationships.length; i++) {
      if (relationships[i].getAttribute("Id") !== relationshipId) continue;
      var target = normalizeZipPath("xl/", relationships[i].getAttribute("Target") || "");
      if (entries[target]) return { path: target, name: name };
    }
    return { path: fallback.path, name: name };
  }

  // Public entry point: an ArrayBuffer in, a row-major string matrix out.
  async function readXlsxRows(arrayBuffer) {
    if (!supportsDeflateRaw()) throw xlsxError("NO_DEFLATE");
    var bytes = new Uint8Array(arrayBuffer);
    if (isLegacyXls(bytes)) throw xlsxError("LEGACY_XLS");
    if (bytes.length < 4 || readUint32LE(bytes, 0) !== ZIP_LOCAL_HEADER) throw xlsxError("CORRUPT");
    assertNotZip64(bytes);

    var entries = readZipEntries(bytes);
    var sharedXml = await readEntryText(entries, "xl/sharedStrings.xml");
    var sharedStrings = sharedXml ? parseSharedStrings(sharedXml) : [];

    var sheet = await resolveFirstSheet(entries);
    var sheetXml = await readEntryText(entries, sheet.path);
    if (!sheetXml) throw xlsxError("CORRUPT");

    return { matrix: parseWorksheetMatrix(sheetXml, sharedStrings), sheetName: sheet.name };
  }

  // Link a schedule entry to an active cycle unit by accent/case-insensitive name.
  function findUnitByName(name) {
    var needle = normalizeToken(name);
    if (needle === "") return null;
    var units = activeUnits();
    for (var i = 0; i < units.length; i++) {
      if (normalizeToken(units[i].name) === needle) return units[i];
    }
    return null;
  }

  /* =========================================================
     DOM helpers — text goes through textContent, never innerHTML
     ========================================================= */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        var value = attrs[key];
        if (value === null || value === undefined || value === false) return;
        if (key === "class") {
          node.className = value;
        } else if (key === "text") {
          node.textContent = value;
        } else if (key === "dataset") {
          Object.keys(value).forEach(function (dataKey) { node.dataset[dataKey] = value[dataKey]; });
        } else if (key === "on") {
          Object.keys(value).forEach(function (eventName) { node.addEventListener(eventName, value[eventName]); });
        } else if (value === true) {
          node.setAttribute(key, "");
        } else {
          node.setAttribute(key, value);
        }
      });
    }
    if (children !== null && children !== undefined) {
      (Array.isArray(children) ? children : [children]).forEach(function (child) {
        if (child === null || child === undefined || child === false) return;
        if (typeof child === "string" || typeof child === "number") {
          node.appendChild(document.createTextNode(String(child)));
        } else {
          node.appendChild(child);
        }
      });
    }
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // SVG namespace is read from the inline sprite so the URL literal never
  // appears in the script (keeps the file free of external-looking strings).
  var SVG_NS = document.getElementById("iconSprite").namespaceURI;

  function icon(name, extraClass) {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", extraClass ? "icon " + extraClass : "icon");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var use = document.createElementNS(SVG_NS, "use");
    use.setAttribute("href", "#icon-" + name);
    svg.appendChild(use);
    return svg;
  }

  /* =========================================================
     Date utilities
     ========================================================= */
  function parseLocalDate(iso) {
    var parts = iso.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function startOfDay(date) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate());
  }

  function daysBetween(from, to) {
    var a = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
    var b = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
    return Math.round((b - a) / MS_PER_DAY);
  }

  function addDays(date, amount) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() + amount);
  }

  function toDisplayDate(iso) {
    // Date-only strings must be parsed as local dates, not UTC, to avoid
    // showing the previous day in negative-offset timezones (e.g. Peru, UTC-5).
    return /^\d{4}-\d{2}-\d{2}$/.test(iso) ? parseLocalDate(iso) : new Date(iso);
  }

  function formatDate(iso) {
    var d = toDisplayDate(iso);
    return d.toLocaleDateString("es-PE", { day: "numeric", month: "short" });
  }

  function formatDateTime(iso) {
    var d = new Date(iso);
    var datePart = d.toLocaleDateString("es-PE", { day: "numeric", month: "short" });
    var timePart = d.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hour12: false });
    return datePart + " · " + timePart;
  }

  function formatLongDate(iso) {
    var d = toDisplayDate(iso);
    return d.toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" });
  }

  function pad2(value) {
    return value < 10 ? "0" + value : String(value);
  }

  function toDateInputValue(date) {
    return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
  }

  function dayKey(date) {
    return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
  }

  /* =========================================================
     Countdown formatting
     ========================================================= */
  function countdownLabel(dueAt, now) {
    var due = new Date(dueAt);
    if (due.getTime() < now.getTime()) return "vencida";

    var dayDiff = daysBetween(startOfDay(now), startOfDay(due));
    if (dayDiff <= 0) return "vence hoy";
    if (dayDiff === 1) return "vence mañana";
    return "vence en " + dayDiff + " días";
  }

  function countdownTone(dueAt, now) {
    var diff = new Date(dueAt).getTime() - now.getTime();
    if (diff < 0) return "danger";
    if (diff <= 48 * 3600000) return "warning";
    return "neutral";
  }

  function humanizeGap(ms) {
    if (ms <= 0) return "en curso";
    var totalHours = Math.floor(ms / 3600000);
    var days = Math.floor(totalHours / 24);
    var hours = totalHours % 24;
    if (days <= 0) return totalHours + " h";
    return days + " d " + hours + " h";
  }

  /* =========================================================
     Derivations
     ========================================================= */
  function getWeekInfo() {
    if (!state.startDate) return null;
    var start = parseLocalDate(state.startDate);
    var today = startOfDay(new Date());
    var dayOffset = daysBetween(start, today);
    var raw = Math.floor(dayOffset / 7) + 1;
    var week = Math.min(state.totalWeeks, Math.max(1, raw));
    return {
      start: start,
      dayOffset: dayOffset,
      beforeStart: dayOffset < 0,
      finished: dayOffset >= state.totalWeeks * 7,
      week: week
    };
  }

  // The final week is always the last week of the configured cycle.
  function isFinalWeek(week) {
    return week === state.totalWeeks;
  }

  // Last week that still counts as classes; everything after it is finals.
  function classWeekEnd() {
    return Math.max(1, Math.min(CYCLE.classWeeks, state.totalWeeks - 1));
  }

  // Phase label follows the configured cycle length, not a hardcoded 16/18.
  function phaseLabel(finals) {
    var classEnd = classWeekEnd();
    if (!finals) return "Clases (sem 1-" + classEnd + ")";
    var finalStart = classEnd + 1;
    var finalEnd = state.totalWeeks;
    var range = finalStart === finalEnd ? "sem " + finalStart : "sem " + finalStart + "-" + finalEnd;
    return "Evaluaciones finales (" + range + ")";
  }

  function getNextMilestone(now) {
    var info = getWeekInfo();
    if (!info) return null;

    var milestones = [];
    state.theoryAssessmentWeeks.forEach(function (week) {
      milestones.push({ week: week, label: "Evaluación de teoría · Semana " + week, type: "theory" });
    });
    [state.totalWeeks].forEach(function (week) {
      milestones.push({ week: week, label: "Evaluaciones finales · Semana " + week, type: "final" });
    });
    milestones.sort(function (a, b) { return a.week - b.week; });

    for (var i = 0; i < milestones.length; i++) {
      var item = milestones[i];
      var date = addDays(info.start, (item.week - 1) * 7);
      if (date.getTime() + 7 * MS_PER_DAY > startOfDay(now).getTime()) {
        item.date = date;
        return item;
      }
    }
    return null;
  }

  function getUnit(unitId) {
    var units = activeUnits();
    for (var i = 0; i < units.length; i++) {
      if (units[i].id === unitId) return units[i];
    }
    return null;
  }

  function pendingCountForUnit(unitId) {
    return state.deadlines.filter(function (d) {
      return d.unitId === unitId && d.status === "pending";
    }).length;
  }

  function getSortedDeadlines() {
    return state.deadlines.slice().sort(function (a, b) {
      return new Date(a.dueAt).getTime() - new Date(b.dueAt).getTime();
    });
  }

  function getUpcomingDeadlines(limit) {
    return getSortedDeadlines().filter(function (d) {
      return d.status === "pending";
    }).slice(0, limit);
  }

  /* =========================================================
     Grade computation — assignment scores, weighted per unit
     ========================================================= */
  // Assignment score (deadline.score) is the grade the teacher gave on a
  // deliverable. It is the only per-assignment grade the weighted average uses.
  function clampGrade(value) {
    if (typeof value !== "number" || !isFinite(value)) return null;
    return Math.min(GRADE_SCALE_MAX, Math.max(0, value));
  }

  function clampTarget(value) {
    if (typeof value !== "number" || !isFinite(value)) return DEFAULT_TARGET;
    return Math.min(GRADE_SCALE_MAX, Math.max(0, value));
  }

  // Round to two decimals so floating point noise never reaches the UI.
  function formatNumber(value) {
    if (typeof value !== "number" || !isFinite(value)) return "";
    return String(Math.round(value * 100) / 100);
  }

  function unitDeadlines(unitId) {
    return state.deadlines.filter(function (d) { return d.unitId === unitId; });
  }

  // Weighted grade math for one didactic unit. Only deadlines that carry BOTH a
  // score and a weight enter the average; a scored deadline without a weight is
  // reported separately instead of being dropped silently.
  //
  //   W = sum of weights of scored deadlines        // weight already graded
  //   P = sum of (score * weight) of scored deadlines
  //   R = 100 - W                                   // weight still ungraded
  //   Promedio de lo calificado = P / W             (only when W > 0)
  //   Aporte acumulado          = P / 100
  //   Pendiente de calificar    = R
  //   necesario = (target * 100 - P) / R            (only when R > 0)
  function computeUnitGrade(deadlines, target) {
    var scored = [];
    var scoredWithoutWeight = [];
    var weightedTotal = 0;

    (deadlines || []).forEach(function (d) {
      if (!d || typeof d !== "object") return;
      var hasScore = typeof d.score === "number" && isFinite(d.score);
      var hasWeight = typeof d.weight === "number" && isFinite(d.weight);
      if (hasWeight) weightedTotal += d.weight;
      if (hasScore && hasWeight) scored.push(d);
      else if (hasScore && !hasWeight) scoredWithoutWeight.push(d);
    });

    var W = 0;
    var P = 0;
    scored.forEach(function (d) {
      W += d.weight;
      P += d.score * d.weight;
    });

    var R = 100 - W;
    var hasAverage = scored.length > 0 && W > 0;

    var result = {
      scored: scored,
      scoredWithoutWeight: scoredWithoutWeight,
      weightedTotal: weightedTotal,
      W: W,
      P: P,
      R: R,
      hasAverage: hasAverage,
      average: hasAverage ? P / W : null,
      aporte: hasAverage ? P / 100 : null,
      pendiente: hasAverage ? R : null,
      target: target,
      necesario: null,
      reachable: true,
      secured: false,
      finished: false
    };

    if (hasAverage) {
      if (R > 0) {
        var necesario = (target * 100 - P) / R;
        result.necesario = necesario;
        result.reachable = necesario <= GRADE_SCALE_MAX;
        result.secured = necesario <= 0;
      } else if (R === 0) {
        // Nothing left to grade: report the final average instead of a "necesario".
        result.finished = true;
      }
      // R < 0 means the unit's weights exceed 100. The render layer warns and
      // deliberately refuses to divide by a negative remainder.
    }

    return result;
  }

  /* =========================================================
     PWA shell — injected only over http(s)
     ========================================================= */
  function pwaHeadAllowed() {
    return location.protocol === "http:" || location.protocol === "https:";
  }

  // Inject the manifest, icon links and web-app meta tags from JavaScript so the
  // raw HTML keeps zero external tags and stays fully functional on file://.
  function injectPwaHead() {
    if (!pwaHeadAllowed()) return;
    try {
      var head = document.head;

      var manifest = document.createElement("link");
      manifest.setAttribute("rel", "manifest");
      manifest.setAttribute("href", "./manifest.webmanifest");
      head.appendChild(manifest);

      var appleIcon = document.createElement("link");
      appleIcon.setAttribute("rel", "apple-touch-icon");
      appleIcon.setAttribute("href", "./icons/apple-touch-icon.png");
      head.appendChild(appleIcon);

      var favicon = document.createElement("link");
      favicon.setAttribute("rel", "icon");
      favicon.setAttribute("type", "image/png");
      favicon.setAttribute("sizes", "32x32");
      favicon.setAttribute("href", "./icons/favicon-32.png");
      head.appendChild(favicon);

      var themeColor = document.createElement("meta");
      themeColor.setAttribute("name", "theme-color");
      themeColor.setAttribute("content", "#2f6df6");
      head.appendChild(themeColor);

      var appleCapable = document.createElement("meta");
      appleCapable.setAttribute("name", "apple-mobile-web-app-capable");
      appleCapable.setAttribute("content", "yes");
      head.appendChild(appleCapable);

      var appleStatusBar = document.createElement("meta");
      appleStatusBar.setAttribute("name", "apple-mobile-web-app-status-bar-style");
      appleStatusBar.setAttribute("content", "default");
      head.appendChild(appleStatusBar);
    } catch (error) {
      // A missing head must never break the app.
    }
  }

  var swRegistration = null;

  // Register the service worker only over http(s). Any failure (file://, private
  // mode, unsupported browser) is swallowed: the app works without it.
  function registerServiceWorker() {
    if (!pwaHeadAllowed()) return;
    if (!("serviceWorker" in navigator)) return;
    try {
      navigator.serviceWorker.register("./sw.js").then(function (registration) {
        swRegistration = registration;
      }).catch(function () {
        // Registration failed silently; the app stays fully functional.
      });
    } catch (error) {
      // Some browsers throw synchronously on unsupported contexts.
    }
  }

  /* =========================================================
     Notifications — in-app only, no backend
     ========================================================= */
  function notificationSupported() {
    return "Notification" in window;
  }

  function notificationPermission() {
    if (!notificationSupported()) return "unsupported";
    return Notification.permission; // "default" | "granted" | "denied"

  function requestNotificationPermission() {
    if (!notificationSupported()) return;
    try {
      var result = Notification.requestPermission(function () {
        renderSettings();
      });
      if (result && typeof result.then === "function") {
        result.then(function () { renderSettings(); });
      }
    } catch (error) {
      renderSettings();
    }
  }

  function isDeadlineNotified(deadlineId, dueAt) {
    return !!state.notified && state.notified[deadlineId] === dueAt;
  }

  function markDeadlineNotified(deadlineId, dueAt) {
    if (!state.notified) state.notified = {};
    state.notified[deadlineId] = dueAt;
  }

  function clearDeadlineNotified(deadlineId) {
    if (state.notified && state.notified[deadlineId] !== undefined) {
      delete state.notified[deadlineId];
    }
  }

  function showDeadlineNotification(deadline, now) {
    var unit = getUnit(deadline.unitId);
    var unitName = unit ? unit.name : "Unidad desconocida";
    var options = {
      body: unitName + " · " + countdownLabel(deadline.dueAt, now),
      tag: "tasktec-deadline-" + deadline.id,
      icon: "./icons/icon-192.png",
      badge: "./icons/favicon-32.png"
    };
    try {
      if (swRegistration && typeof swRegistration.showNotification === "function") {
        swRegistration.showNotification(deadline.title, options);
      } else {
        new Notification(deadline.title, options);
      }
    } catch (error) {
      // A notification failure must never surface as a broken UI.
    }
  }

  // Notify each pending deadline that just crossed the 24 h threshold, once. The
  // record lives in localStorage (state.notified) so it never repeats, and it is
  // cleared when the deadline is edited or deleted.
  function checkDeadlineNotifications() {
    if (!notificationSupported()) return;
    if (Notification.permission !== "granted") return;
    if (!state.notifyEnabled) return;

    var now = new Date();
    var nowMs = now.getTime();
    var changed = false;

    state.deadlines.forEach(function (deadline) {
      if (deadline.status !== "pending") return;
      var dueMs = new Date(deadline.dueAt).getTime();
      if (!isFinite(dueMs)) return;
      var diff = dueMs - nowMs;
      if (diff <= 0 || diff > NOTIFY_THRESHOLD_MS) return;
      if (isDeadlineNotified(deadline.id, deadline.dueAt)) return;
      markDeadlineNotified(deadline.id, deadline.dueAt);
      changed = true;
      showDeadlineNotification(deadline, now);
    });

    if (changed) saveState();
  }

  var notificationTimer = null;

  function startNotificationWatcher() {
    checkDeadlineNotifications();
    if (notificationTimer !== null) window.clearInterval(notificationTimer);
    notificationTimer = window.setInterval(function () {
      if (document.visibilityState === "hidden") return;
      checkDeadlineNotifications();
    }, 60000);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") checkDeadlineNotifications();
    });
  }

  /* =========================================================
     Rendering — shared pieces
     ========================================================= */

  var editingDeadlineId = null;
  var formStatus = "pending";
  var currentMilestone = null;

  function renderHeader() {
    var campusEl = document.getElementById("headerCampusText");
    if (campusEl) campusEl.textContent = state.campus ? "Sede " + state.campus : "Sede sin definir";
    var subEl = document.getElementById("brandSub");
    if (subEl) {
      var program = getActiveProgram();
      subEl.textContent = "Ciclo " + state.cycleNumber + (program ? " · " + program.name : "");

  }

  function renderChip(text, tone, iconName) {
    var chip = el("span", { class: "chip chip-" + (tone || "neutral") });
    if (iconName) chip.appendChild(icon(iconName));
    chip.appendChild(document.createTextNode(text));
    return chip;
  }

    var node = el("div", { class: "empty" }, [
      el("div", { class: "empty-icon", "aria-hidden": "true" }, [icon(iconName)]),
      el("div", { class: "empty-title", text: title }),
      el("p", { class: "empty-text", text: message })
    ]);
    if (action) node.appendChild(action);
    return node;
  }

  function deadlineCard(deadline, now, options) {
    var unit = getUnit(deadline.unitId);
    var due = new Date(deadline.dueAt);
    var submitted = deadline.status === "submitted";
    var overdue = !submitted && due.getTime() < now.getTime();
    var soon = !submitted && !overdue && (due.getTime() - now.getTime()) <= 48 * 3600000;

    var cardClass = "deadline";
    if (submitted) cardClass += " is-submitted";
    else if (overdue) cardClass += " is-overdue";
    else if (soon) cardClass += " is-soon";

    var top = el("div", { class: "deadline-top" }, [
      el("div", {}, [
        el("div", { class: "deadline-title", text: deadline.title }),
        el("div", { class: "deadline-meta", text: (unit ? unit.name : "Unidad desconocida") + " · " + formatDateTime(deadline.dueAt) })
      ])
    ]);

    if (typeof deadline.weight === "number") {
      top.appendChild(renderChip(deadline.weight + "% de la nota", "accent"));
    }

    ]);

    actions.appendChild(el("span", { class: "spacer" }));
    actions.appendChild(el("button", {
      type: "button", class: "btn btn-sm btn-ghost",
      on: { click: function () { openDeadlineForm(deadline.id); } }
    }, [

    ]));

      on: { click: function () { deleteDeadline(deadline.id); } }
    }, [

    ]));

    if (options && options.compact) actions.remove();

    var node = el("article", { class: cardClass }, [top, chips]);
    if (options && options.inlineGrade) node.appendChild(inlineGradeRow(deadline));
    if (!(options && options.compact)) node.appendChild(actions);
    return node;

  /* =========================================================
     Inline grade entry — jot a teacher grade straight on the row
     ========================================================= */
  // This is an extra, faster path to deadline.score. It persists through the
  // same saveState() the edit form uses, and it never replaces #fieldScore.
  var INLINE_GRADE_NOTE = "Esta entrega no tiene peso: su nota no entra al promedio ponderado. Edítala para asignarle un peso.";

  function stopRowActivation(event) {
    // The row may be clickable in other contexts; the input must never trigger it.
    event.stopPropagation();
  }

  // Reuses computeUnitGrade's own classification instead of re-deriving the
  // "scored but unweighted" rule: ask the verified math and check membership.
  function deadlineScoredWithoutWeight(deadline) {
    var result = computeUnitGrade(unitDeadlines(deadline.unitId), state.target);
    return result.scoredWithoutWeight.some(function (d) { return d.id === deadline.id; });
  }

  function inlineGradeRow(deadline) {
    var note = el("p", { class: "inline-grade-note", hidden: true, "data-grade-note": "", text: INLINE_GRADE_NOTE });
    var inputId = "inline-grade-" + deadline.id;
    var input = el("input", {
      class: "input inline-grade-input",
      type: "number", id: inputId,
      min: "0", max: "20", step: "0.5", inputmode: "decimal",
      placeholder: "Sin nota",
      value: typeof deadline.score === "number" ? formatNumber(deadline.score) : "",
      "aria-label": "Nota de " + deadline.title + " (0 a 20)",
      on: {
        click: stopRowActivation,
        mousedown: stopRowActivation,
        pointerdown: stopRowActivation,
        change: function () { commitInlineGrade(deadline, input, note); },
        blur: function () { commitInlineGrade(deadline, input, note); },
        keydown: function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            commitInlineGrade(deadline, input, note);
            input.blur();
          } else if (event.key === "Escape") {
            event.preventDefault();
            event.stopPropagation();
            input.value = typeof deadline.score === "number" ? formatNumber(deadline.score) : "";
            input.blur();
          }
        }
      }
    });
    note.hidden = !deadlineScoredWithoutWeight(deadline);
    return el("div", { class: "inline-grade", dataset: { inlineGrade: deadline.id } }, [
      el("label", { class: "inline-grade-label", for: inputId, text: "Nota" }),
      input,
      el("span", { class: "inline-grade-max", "aria-hidden": "true", text: "/ 20" }),
      note
    ]);
  }

  function commitInlineGrade(deadline, input, note) {
    // A number input reports "" for an invalid intermediate value (e.g. "-" or
    // "1e"). validity.badInput tells that apart from a real, intentional clear.
    if (input.validity && input.validity.badInput) {
      input.value = typeof deadline.score === "number" ? formatNumber(deadline.score) : "";
      return;
    }
    var raw = input.value.trim();
    if (raw === "") {
      deadline.score = null;
    } else {
      var parsed = parseFloat(raw);
      if (!isFinite(parsed)) {
        // Non-numeric input never wipes a previously valid grade.
        input.value = typeof deadline.score === "number" ? formatNumber(deadline.score) : "";
        return;
      }
      var clamped = clampGrade(parsed);
      deadline.score = clamped;
      input.value = formatNumber(clamped);
    }
    saveState();
    syncDeadlineScoreChip(deadline, input);
    if (note) note.hidden = !deadlineScoredWithoutWeight(deadline);
    refreshUnitGradeCard();
  }

  function syncDeadlineScoreChip(deadline, input) {
    // Scope to the card that owns this input: the same deadline can be rendered
    // in more than one screen, and only the visible one should change.
    var card = input ? input.closest(".deadline") : null;
    if (!card) return;
    var top = card.querySelector(".deadline-top");
    if (!top) return;
    var chip = top.querySelector('[data-score-chip="' + deadline.id + '"]');
    if (typeof deadline.score === "number") {
      var text = "Nota " + formatNumber(deadline.score) + " / 20";
      if (chip) {
        chip.textContent = text;
      } else {
        chip = renderChip(text, "success");
        chip.setAttribute("data-score-chip", deadline.id);
        top.appendChild(chip);
      }
    } else if (chip) {
      chip.parentNode.removeChild(chip);
    }
  }

  // Rebuild only the unit modal's grade summary so the numbers move live while
  // the input keeps focus. The modal itself never has to reopen.
  function refreshUnitGradeCard() {
    if (!activeUnitId) return;
    var current = document.getElementById("unitGradeCard");
    if (!current) return;
    var unit = getUnit(activeUnitId);
    if (!unit) return;
    var fresh = renderUnitGradeCard(unit);
    current.parentNode.replaceChild(fresh, current);
  }

  function renderAlerts(now) {
    var pending = state.deadlines.filter(function (d) { return d.status === "pending"; });
    var overdue = pending.filter(function (d) { return new Date(d.dueAt).getTime() < now.getTime(); });
    var soon = pending.filter(function (d) {
      var diff = new Date(d.dueAt).getTime() - now.getTime();
      return diff >= 0 && diff <= 48 * 3600000;
    });

    if (overdue.length === 0 && soon.length === 0) return null;

    var text;
    var tone;
    if (overdue.length > 0) {
      tone = "alert-danger";
      text = overdue.length === 1
        ? "Tienes 1 entrega vencida."
        : "Tienes " + overdue.length + " entregas vencidas.";
      if (soon.length > 0) text += " Además, " + (soon.length === 1 ? "1 vence" : soon.length + " vencen") + " en menos de 48 h.";
    } else {
      tone = "alert-warning";
      text = soon.length === 1
        ? "1 entrega vence en menos de 48 h."
        : soon.length + " entregas vencen en menos de 48 h.";
    }

    return el("div", { class: "alert " + tone }, [
      el("span", { class: "alert-icon", "aria-hidden": "true" }, [icon(overdue.length > 0 ? "alert" : "clock")]),
      el("span", { text: text })
    ]);
  }

    for (var week = 1; week <= state.totalWeeks; week++) {
      var classes = "tl-week";
      if (week < currentWeek) classes += " past";
      if (week === currentWeek) classes += " current";
      if (state.theoryAssessmentWeeks.indexOf(week) !== -1) classes += " theory";
      if (isFinalWeek(week)) classes += " final";

      var label = "Semana " + week;
      if (week === currentWeek) label += " (actual)";
      if (state.theoryAssessmentWeeks.indexOf(week) !== -1) label += " — evaluación de teoría";
      if (isFinalWeek(week)) label += " — evaluaciones finales";

      strip.appendChild(el("div", {
        class: classes,
        role: "listitem",
        title: label,
        "aria-label": label,
        dataset: { week: String(week) }
      }, [
        String(week),
        el("span", { class: "tl-dot", "aria-hidden": "true" })
      ]));
    }

    var legend = el("div", { class: "timeline-legend" }, [
      el("span", { class: "legend-item" }, [
        el("span", { class: "legend-swatch", style: "background: var(--accent); border-color: var(--accent);" }),

  // Import is hosted in the Horario screen (not Settings): the preview, the

  var schedulePreview = null; // parsed import awaiting explicit confirmation

  var scheduleImportOpen = false; // import is secondary: collapsed until asked

  function renderScheduleBuilder() {

  function renderScheduleSlotList(day) {
    var slots = scheduleSlotBounds();
    var occupancy = scheduleSlotOccupancy(day);
    var list = el("div", { class: "slot-list" });
    var index = 0;
    while (index < slots.length) {
      if (!occupancy[index]) {
        list.appendChild(scheduleEmptySlotRow(day, slots[index]));
        index += 1;
        continue;
      }
      var end = index;
      while (end + 1 < slots.length && occupancy[end + 1] &&
             occupancy[end + 1].unit === occupancy[index].unit &&
             occupancy[end + 1].room === occupancy[index].room) {
        end += 1;
      }
      list.appendChild(scheduleBlockRow(day, index, end + 1, occupancy[index], slots));
      index = end + 1;
    }
    return list;
  }

  function scheduleEmptySlotRow(day, slot) {
    return el("button", {
      type: "button",
      class: "slot-row slot-empty",
      "aria-pressed": "false",
      "aria-label": scheduleDayName(day) + ", " + slot.start + " a " + slot.end + ", libre. Toca para marcar clase",
      dataset: { day: String(day), from: String(slot.index), to: String(slot.index + 1) },
      on: { click: function () { toggleScheduleSlot(day, slot.index); } }
    }, [
      el("span", { class: "slot-time", text: slot.start }),
